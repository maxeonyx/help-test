name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install test runners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.1 \
            --repo maxeonyx/tdd-ratchet-rs \
            --pattern cargo-ratchet-x86_64-linux \
            --dir /tmp/tdd-ratchet
          install /tmp/tdd-ratchet/cargo-ratchet-x86_64-linux "$HOME/.cargo/bin/cargo-ratchet"
          cargo install cargo-nextest --locked
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo ratchet

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if gh release view "$version" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$version")" = "$GITHUB_SHA"
          else
            gh release create "$version" --target "$GITHUB_SHA" --generate-notes --title "$version"
          fi
